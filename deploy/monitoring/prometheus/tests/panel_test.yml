# Unit tests for the alert rules (promtool test rules). Run by deploy/monitoring/check_configs.sh.
rule_files:
  - ../rules/panel.yml

evaluation_interval: 15s

tests:
  # Worker stops writing its heartbeat: nothing for a healthy age, alert once age > 90 s for 30 s.
  - interval: 15s
    input_series:
      - series: 'proxyhub_worker_heartbeat_age_seconds{job="proxyhub-api", instance="api:8000"}'
        values: "5x11 200x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: WorkerHeartbeatStale
        exp_alerts: []
      - eval_time: 3m15s
        alertname: WorkerHeartbeatStale
        exp_alerts: []
      - eval_time: 4m
        alertname: WorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyhub-api
              instance: "api:8000"
            exp_annotations:
              summary: "worker پنل از کار افتاده است"
              description: "آخرین ضربان worker ۳ دقیقه و ۲۰ ثانیه پیش بوده است (حد مجاز ۹۰ ثانیه). چرخه‌های کنترل اجرا نمیشوند."

  # No heartbeat row at all reads as +Inf (alert); database unreachable reads as NaN (no worker alert;
  # PanelDatabaseDown covers it instead).
  - interval: 15s
    input_series:
      - series: 'proxyhub_worker_heartbeat_age_seconds{job="proxyhub-api", instance="api:8000"}'
        values: "Inf Inf Inf Inf Inf Inf Inf Inf Inf Inf Inf Inf"
      - series: 'proxyhub_worker_heartbeat_age_seconds{job="proxyhub-api", instance="other:8000"}'
        values: "NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN"
      - series: 'proxyhub_db_up{job="proxyhub-api", instance="other:8000"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: WorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyhub-api
              instance: "api:8000"
            exp_annotations:
              summary: "worker پنل از کار افتاده است"
              description: "worker هنوز هیچ ضربانی در دیتابیس ثبت نکرده است (حد مجاز ۹۰ ثانیه). چرخه‌های کنترل اجرا نمیشوند."
      - eval_time: 2m
        alertname: PanelDatabaseDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyhub-api
              instance: "other:8000"
            exp_annotations:
              summary: "دیتابیس پنل پاسخ نمیدهد"
              description: "API پنل بیش از ۱ دقیقه به PostgreSQL وصل نشده است."

  # API scrape fails for more than 2 minutes.
  - interval: 15s
    input_series:
      - series: 'up{job="proxyhub-api", instance="api:8000"}'
        values: "1x4 0x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: PanelApiDown
        exp_alerts: []
      - eval_time: 3m30s
        alertname: PanelApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyhub-api
              instance: "api:8000"
            exp_annotations:
              summary: "API پنل از دسترس خارج است"
              description: "Prometheus بیش از ۲ دقیقه نتوانسته متریک‌های API پنل را بخواند."
      - eval_time: 3m30s
        alertname: MonitoringTargetDown
        exp_alerts: []

  # Disk: / at 90 % alerts after 5 minutes; a full tmpfs never alerts.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node", instance="node-exporter:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "50x5 10x10"
      - series: 'node_filesystem_size_bytes{job="node", instance="node-exporter:9100", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: "100x15"
      - series: 'node_filesystem_avail_bytes{job="node", instance="node-exporter:9100", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: "1x15"
      - series: 'node_filesystem_size_bytes{job="node", instance="node-exporter:9100", device="tmpfs", fstype="tmpfs", mountpoint="/run"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 8m
        alertname: DiskAlmostFull
        exp_alerts: []
      - eval_time: 12m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: "node-exporter:9100"
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "دیسک سرور پنل نزدیک پر شدن است"
              description: "۹۰٪ از دیسک / پر است (حد هشدار ۸۵٪)."

  # Backups: a success at t=1h is fine for 26 h, then BackupTooOld; a failed run alerts at once.
  - interval: 5m
    input_series:
      - series: 'proxyhub_backup_last_success_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "3600x400"
      - series: 'proxyhub_backup_last_run_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "3600x400"
      - series: 'proxyhub_backup_last_run_success{job="node", instance="node-exporter:9100"}'
        values: "1x300 0x100"
    alert_rule_test:
      - eval_time: 26h
        alertname: BackupTooOld
        exp_alerts: []
      - eval_time: 28h
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "backup دیتابیس کهنه است"
              description: "آخرین backup موفق ۱ روز و ۳ ساعت پیش بوده است (حد مجاز ۲۶ ساعت)."
      - eval_time: 24h
        alertname: BackupFailed
        exp_alerts: []
      - eval_time: 25h5m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "backup دیتابیس شکست خورد"
              description: "آخرین اجرای backup روزانه موفق نبود. جزئیات: journalctl -u proxyhub-backup.service"
      - eval_time: 30h
        alertname: BackupMetricsMissing
        exp_alerts: []

  # Never any backup metric (timer never ran): alert after 26 h.
  - interval: 5m
    input_series:
      - series: 'up{job="node", instance="node-exporter:9100"}'
        values: "1x400"
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupMetricsMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "backup اصلاً اجرا نشده است"
              description: "۲۶ ساعت است که هیچ نشانه‌ای از اجرای backup نیست (timer روشن است؟)."

  # Restore test failed on its last run.
  - interval: 5m
    input_series:
      - series: 'proxyhub_restore_test_last_run_success{job="node", instance="node-exporter:9100"}'
        values: "1x5 0x5"
      - series: 'proxyhub_restore_test_last_run_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: RestoreTestFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: RestoreTestFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "آزمون بازگردانی backup شکست خورد"
              description: "آخرین backup به‌درستی بازگردانده نشد؛ ممکن است backupها قابل استفاده نباشند. جزئیات: journalctl -u proxyhub-restore-test.service"

  # Ages with every unit and zero parts dropped; "never succeeded" (last success 0, i.e. decades
  # ago; promtool's clock starts at 0, so a timestamp far before it stands in for that).
  - interval: 5m
    input_series:
      - series: 'proxyhub_restore_test_last_success_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "3595x3000"
      - series: 'proxyhub_backup_last_success_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: "-1700000000x20"
      - series: 'proxyhub_worker_heartbeat_age_seconds{job="proxyhub-api", instance="api:8000"}'
        values: "3725x20"
    alert_rule_test:
      - eval_time: 8d2h
        alertname: RestoreTestTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "آزمون بازگردانی هفتگی اجرا نشده است"
              description: "آخرین آزمون بازگردانی موفق ۸ روز و ۱ ساعت و ۵ ثانیه پیش بوده است (حد مجاز ۸ روز)."
      - eval_time: 30m
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "backup دیتابیس کهنه است"
              description: "هنوز هیچ backup موفقی ثبت نشده است (حد مجاز ۲۶ ساعت)."
      - eval_time: 30m
        alertname: WorkerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyhub-api
              instance: "api:8000"
            exp_annotations:
              summary: "worker پنل از کار افتاده است"
              description: "آخرین ضربان worker ۱ ساعت و ۲ دقیقه و ۵ ثانیه پیش بوده است (حد مجاز ۹۰ ثانیه). چرخه‌های کنترل اجرا نمیشوند."

  # Watchdog is always firing (it feeds the external dead man's switch, never Telegram).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "نگهبان: زنجیره‌ی پایش زنده است"
              description: "این هشدار همیشه روشن است و فقط به نگهبان بیرونی میرود، نه به تلگرام."

  # The deploy guard refused the newest commit of main: alert at once; cleared by a good deploy.
  - interval: 1m
    input_series:
      - series: 'proxyhub_deploy_refused{job="node", instance="node-exporter:9100"}'
        values: "0x5 1x5 0x5"
    alert_rule_test:
      - eval_time: 4m
        alertname: DeployRefused
        exp_alerts: []
      - eval_time: 7m
        alertname: DeployRefused
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "استقرار رد شد: کدی بیرون از PR روی main آمد"
              description: "سرور تازه‌ترین commit شاخه‌ی main را اجرا نکرد، چون ادغام امضاشده‌ی یک PR در گیت‌هاب نبود. ممکن است کسی مستقیم روی main کد فرستاده باشد. نسخه‌ی قبلی همچنان در حال کار است. جزئیات: journalctl -u proxyhub-deployer.service"
      - eval_time: 14m
        alertname: DeployRefused
        exp_alerts: []
