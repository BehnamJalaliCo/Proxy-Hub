# Prometheus for the Proxy-Hub panel server (M1.7). Internal only: no published port; Grafana on
# 127.0.0.1:3000 is the only way in. Panel metrics are aggregates (rule 7: no user IPs anywhere).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    system: proxy-hub

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI /internal/metrics: worker heartbeat age, DB/Redis up, nodes, accounts, outbox.
  # Caddy never exposes /internal/* publicly; Prometheus reaches api over the backend network.
  - job_name: proxyhub-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8000"]

  # Host metrics + textfile metrics written by deploy/backup/*.sh (backup age, restore test).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
