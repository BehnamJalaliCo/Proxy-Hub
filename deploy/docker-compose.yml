# Proxy-Hub panel: core stack (docs/10 section 3.2). Monitoring stack (Prometheus, Alertmanager,
# Loki, Grafana) is added in M1.7. Images are pinned by digest (resolved 2026-11-03). Secrets are files under /etc/proxy-hub/secrets (root-only 0700
# directory) and are mounted read-only at /run/secrets; nothing secret is in env vars or the repo.
name: proxyhub

x-panel: &panel
  image: proxyhub/panel:${PROXYHUB_GIT_COMMIT:-dev}
  build:
    context: ../panel
    target: runtime
    args:
      GIT_COMMIT: ${PROXYHUB_GIT_COMMIT:-dev}
  secrets: [db_password, redis_password]
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:16-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
    environment:
      POSTGRES_USER: proxyhub
      POSTGRES_DB: proxyhub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxyhub -d proxyhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    # The password goes into a 0600 config file inside the container, never into argv (visible in ps).
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nsave ""\nappendonly no\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *panel
    command: ["python", "-m", "proxyhub", "migrate"]
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *panel
    command: ["python", "-m", "proxyhub", "api"]
    ports: ["127.0.0.1:8000:8000"]  # loopback only: deployer health check. Public traffic goes via caddy.
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *panel
    command: ["python", "-m", "proxyhub", "worker"]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  caddy:
    profiles: ["edge"]  # enabled by the deployer once PANEL_DOMAIN is set in /etc/proxy-hub/deploy.env
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}  # the deployer enables this profile only when the domain is set
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    networks: [backend]

secrets:
  db_password:
    file: /etc/proxy-hub/secrets/db_password
  redis_password:
    file: /etc/proxy-hub/secrets/redis_password

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  backend:
