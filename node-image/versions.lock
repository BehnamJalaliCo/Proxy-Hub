# Pinned components of a Proxy-Hub Telemt node image (docs/10 M2.4, docs/11 section 4).
# KEY=value lines only (read by provision.sh and build-agent.sh with grep, never sourced).
# Any change here is a reviewed commit; provision.sh refuses an artifact whose sha256 differs.

# Telemt 3.5.16 (2026-10-31, commit 84e5b82), official release asset for Linux x86_64 (glibc).
# Downloaded and hashed on 2026-11-03; the hash equals the release's own .sha256 file. Not executed.
TELEMT_VERSION=3.5.16
TELEMT_URL=https://github.com/telemt/telemt/releases/download/3.5.16/telemt-x86_64-linux-gnu.tar.gz
TELEMT_TARBALL_SHA256=e6f46b2f3becf29bfd555cec8a059e429f7c082c1af402499b3a7940cf8ebd34
# The single file inside the tarball ("telemt", 17075200 bytes).
TELEMT_BINARY_SHA256=1954f18faeb9f5838e9444880f2ffb00704c6bd5b2836bc86dd64611537d49b8

# Xray-core 26.10.31 (2026-10-31, commit a4a3dff, built with go1.27.3): VLESS + REALITY on TCP 443.
# Official release asset for Linux x86_64. Downloaded and hashed on 2026-11-04; XCORE_ZIP_SHA256 equals
# the SHA2-256 line of the release's own Xray-linux-64.zip.dgst. Only two files of the zip are
# installed: the binary and geoip.dat (needed for the "geoip:private" routing block). This release is
# four days old: docs/10 X1 records it as an emergency security release and the earlier October
# releases as withdrawn, so the newest release that is at least two weeks old (26.10.21) is the
# vulnerable one. The sources of exactly this tag were read for docs/10 (section 10).
XRAY_VERSION=26.10.31
XRAY_URL=https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip
XCORE_ZIP_SHA256=e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214
# "xray" inside the zip (35151996 bytes) and "geoip.dat" (3312784 bytes). The hash keys are XCORE_*,
# not XRAY_*: the secret scanner's rule for JFrog Xray tokens would take a 64-hex value right after
# "XRAY...=" for a leaked token (gitleaks jfrog-identity-token).
XCORE_BINARY_SHA256=cc4b84d3069569f297a61f04b914f2bb37e9d202fd7b84cb50def1fc30fd40e1
XCORE_GEOIP_SHA256=ce90dc02a81528109c99d769e1f8fe3071ded6b02a574f31e62d8f4eee312563

# proxyhub-agent, built from agent/ in this repository by node-image/build-agent.sh
# (go1.24.7, CGO off, -trimpath, empty build id: reproducible). A test rebuilds it and compares.
AGENT_VERSION=0.4.0
AGENT_GO_VERSION=1.24.7
AGENT_SHA256=31ce7724bae743c889a5eb24fdbacfefc84bfb884357a9a09443e70881c77485
