#!/usr/sbin/nft -f
# Proxy-Hub node firewall (docs/10 M2.4). Loaded at boot by nftables.service.
# Egress: no mail (25/465/587, abuse), no private or special-purpose ranges, no metadata service
# (169.254.169.254) after cloud-init. Ingress: never SSH, never Telemt's metrics/API ports.
# Counters only count packets; no rule logs anything (CLAUDE.md rule 7).

flush ruleset

table inet proxyhub {
	set private4 {
		type ipv4_addr
		flags interval
		elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16,
			     172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15,
			     198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
	}

	set private6 {
		type ipv6_addr
		flags interval
		elements = { fc00::/7, fec0::/10, 2001:db8::/32, ::ffff:0.0.0.0/96 }
	}

	# Emptied for good by proxyhub-lockdown.service after cloud-final: until then root (cloud-init)
	# may fetch this node's user data from the metadata service.
	chain boot_window {
		ip daddr 169.254.169.254 tcp dport 80 meta skuid 0 accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
		oif "lo" accept
		tcp dport { 25, 465, 587 } counter drop
		# Hetzner Cloud DHCP (lease renewals go to the gateway address).
		ip daddr 172.31.1.1 udp dport 67 accept
		jump boot_window
		ip daddr 169.254.169.254 counter drop
		ip daddr @private4 counter drop
		ip6 daddr @private6 counter drop
	}

	chain input {
		type filter hook input priority filter; policy accept;
		iif "lo" accept
		tcp dport { 22, 9090, 9091 } counter drop
	}
}
