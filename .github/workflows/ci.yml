name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: proxyhub
          POSTGRES_PASSWORD: throwaway-ci-db
          POSTGRES_DB: proxyhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proxyhub -d proxyhub"
          --health-interval 2s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: panel
    env:
      PROXYHUB_DATABASE_URL: postgresql+asyncpg://proxyhub:throwaway-ci-db@127.0.0.1:5432/proxyhub
      PROXYHUB_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run --frozen ruff check proxyhub tests
      - run: uv run --frozen ruff format --check proxyhub tests
      - run: uv run --frozen mypy proxyhub
      - run: uv run --frozen pytest -q

  dashboard:
    # Owner dashboard (dashboard/): exact lockfile install, lint, strict typecheck, unit tests, build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh ops/scripts/*.sh
      - run: docker compose -p proxyhub -f deploy/docker-compose.yml config -q
      - run: docker compose -f deploy/docker-compose.test.yml config -q
      - run: docker build --target runtime panel

  stack-restart:
    # Real core stack on the runner: start, restart all, restart redis alone (catches restart-only bugs).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo sysctl -w fs.protected_regular=2
          sudo install -d -m 0700 /etc/proxy-hub /etc/proxy-hub/secrets
          for f in db_password redis_password master_key; do
            openssl rand -hex 32 | sudo tee /etc/proxy-hub/secrets/$f >/dev/null
            sudo chmod 0444 /etc/proxy-hub/secrets/$f
          done
          sudo openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /etc/proxy-hub/secrets/agent_ca_key
          sudo chmod 0444 /etc/proxy-hub/secrets/agent_ca_key
      - run: sudo bash ops/scripts/stack_restart_test.sh proxyhub-ci
      - if: always()
        run: sudo docker compose -p proxyhub-ci -f deploy/docker-compose.yml down -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source /repo --no-banner --redact
