name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: proxyhub
          POSTGRES_PASSWORD: throwaway-ci-db
          POSTGRES_DB: proxyhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proxyhub -d proxyhub"
          --health-interval 2s --health-retries 30
      redis:
        image: redis:7-bookworm
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: panel
    env:
      PROXYHUB_DATABASE_URL: postgresql+asyncpg://proxyhub:throwaway-ci-db@127.0.0.1:5432/proxyhub
      PROXYHUB_REDIS_URL: redis://127.0.0.1:6379/0
      # The video frame tests run the real ffmpeg; here they fail instead of skipping without it.
      PROXYHUB_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      # ffmpeg/ffprobe for the content supervisor's video frames (proxyhub/content/frames.py), from
      # the runner's own Ubuntu archive when the image does not already have it.
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"  # = AGENT_GO_VERSION in node-image/versions.lock (reproducible agent)
          cache: false
      # The agent e2e test runs the real Go agent through real Caddy mTLS; it skips without the image.
      - run: docker pull caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
      # Pebble (Let's Encrypt's test CA) and its DNS server: the ACME tests order real certificates.
      - run: docker pull ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
      - run: docker pull ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run --frozen ruff check proxyhub tests
      - run: uv run --frozen ruff format --check proxyhub tests
      - run: uv run --frozen mypy proxyhub
      # The pinned Xray (three sha256 checks) so the Reality tests also run it, not only render.
      - run: bash ../node-image/fetch-xray.sh "$RUNNER_TEMP/xray"
      - run: PROXYHUB_TEST_XRAY="$RUNNER_TEMP/xray/xray" uv run --frozen pytest -q

  dashboard:
    # Owner dashboard (dashboard/): exact lockfile install, lint, strict typecheck, unit tests, build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: bash ../node-image/fetch-xray.sh "$RUNNER_TEMP/xray"
      - run: PROXYHUB_TEST_XRAY="$RUNNER_TEMP/xray/xray" go test -count=1 ./...

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh deploy/backup/*.sh deploy/claude-bridge/*.sh deploy/monitoring/*.sh ops/scripts/*.sh node-image/*.sh
      - run: shellcheck -s sh deploy/monitoring/alertmanager/entrypoint.sh
      # promtool config/rules/rule unit tests, amtool for every receiver variant, the runtime
      # bot-token leak check of Alertmanager, loki and alloy, all with the pinned images.
      - run: bash deploy/monitoring/check_configs.sh
      - run: docker compose -p proxyhub -f deploy/docker-compose.yml config -q
      - run: docker compose -f deploy/docker-compose.test.yml config -q
      # The runtime image also builds the node agent from agent/ and checks its sha256 against
      # node-image/versions.lock (panel/Dockerfile, agent-build stage).
      - run: >-
          docker build --build-context dashboard=dashboard --build-context agent=agent
          --build-context node-image=node-image --target runtime panel

  stack-restart:
    # Real core stack on the runner: start, restart all, restart redis alone (catches restart-only bugs).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same script as install.sh and the deployer: every secret file compose mounts (monitoring
      # included). Without age on the runner it only skips backup_age_key, which nothing mounts.
      - run: |
          sudo sysctl -w fs.protected_regular=2
          sudo bash deploy/ensure_secrets.sh
      - run: sudo bash ops/scripts/stack_restart_test.sh proxyhub-ci
      - if: always()
        run: sudo docker compose -p proxyhub-ci -f deploy/docker-compose.yml down -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source /repo --no-banner --redact
